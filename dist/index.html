  root.addEventListener('keydown',e=>{let card=e.target.closest('[data-composer-panel]');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();composerPanelId=card.dataset.composerPanel;render();root.querySelector('[data-composer-panel="'+CSS.escape(composerPanelId)+'"]')?.focus()}});
  async function start(){locale=localStorage.getItem(interfaceLocaleKey)||'en';document.documentElement.lang=locale;try{localeStrings=await fetch(`locales/${locale}.json`).then(response=>response.ok?response.json():{});if(localeStrings.draft&&locale!=='xh')locale='en'}catch{locale='en';localeStrings={}}try{normalizeLanguages(p);await openAssetDb();await hydrateAssets()}catch{notify('Image storage could not start. Check browser storage permissions.')}try{let manifest=await fetch('demo-drafts.json').then(r=>r.ok?r.json():null);demoDrafts=manifest?.drafts||[]}catch{}try{liveCoordinatorAvailable=(await fetch('/api/health').then(r=>r.json())).coordinatorAvailable===true}catch{}sceneId=p.scenes.find(s=>s.id===sceneId)?.id||p.scenes[0]?.id||'';render()}
  start();
})();
</script></body></html>
